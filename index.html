<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSK Odessa — Управление строительством</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Шапка навигации с вашей картинкой-логотипом -->
    <header class="bg-[#059669] text-white shadow-md border-b-4 border-[#10b981]">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <!-- Логотип и название -->
            <div class="flex items-center gap-3">
                <div class="bg-white p-1 rounded-lg shadow-sm flex items-center justify-center">
                    <img src="logo.png" alt="RSK Logo" class="h-9 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide leading-tight">RSK Odessa</h1>
                    <p class="text-[10px] text-emerald-100 tracking-wider uppercase">building & repair</p>
                </div>
            </div>
            <!-- Навигационные кнопки -->
            <div class="flex flex-wrap gap-2 items-center">
                <button onclick="switchTab('projects')" id="btn-projects" class="px-3 py-2 bg-[#10b981] rounded-lg text-xs sm:text-sm font-semibold transition shadow">🏗 Объекты</button>
                <button onclick="switchTab('employees')" id="btn-employees" class="px-3 py-2 bg-[#10b981]/70 hover:bg-[#10b981] rounded-lg text-xs sm:text-sm font-semibold transition shadow">👥 Сотрудники (<span id="employees-badge">0</span>)</button>
                <button onclick="switchTab('orders')" id="btn-orders" class="px-3 py-2 bg-[#10b981]/70 hover:bg-[#10b981] rounded-lg text-xs sm:text-sm font-semibold transition shadow">📦 Снабжение (<span id="orders-badge">0</span>)</button>
                <button onclick="switchTab('new-order')" id="btn-new-order" class="px-3 py-2 bg-[#34d399] hover:bg-[#059669] text-white rounded-lg text-xs sm:text-sm font-semibold transition shadow">➕ Новая заявка</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 mt-2">

        <!-- ВКЛАДКА 1: ОБЪЕКТЫ И СМЕТЫ -->
        <section id="tab-projects" class="space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-[#10b981]">
                <h2 class="text-lg font-bold text-gray-800">📋 Активные объекты</h2>
                <button onclick="openAddProjectModal()" class="bg-[#059669] hover:bg-[#047857] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">➕ Добавить объект</button>
            </div>
            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Сюда динамически рендерятся объекты -->
            </div>
        </section>

        <!-- ВКЛАДКА 2: СОТРУДНИКИ -->
        <section id="tab-employees" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border-l-4 border-[#10b981]">
                <h2 class="text-lg font-bold text-gray-800">👥 Управление сотрудниками</h2>
                <button onclick="openAddEmployeeModal()" class="bg-[#059669] hover:bg-[#047857] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">➕ Добавить сотрудника</button>
            </div>
            <div id="employees-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Сюда динамически рендерятся карточки-кнопки сотрудников -->
            </div>
        </section>

        <!-- ВКЛАДКА 3: СНАБЖЕНИЕ -->
        <section id="tab-orders" class="hidden bg-white rounded-xl shadow-md p-6 space-y-4 border-t-4 border-[#10b981]">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-gray-800">📦 Контроль заявок на материалы</h2>
                <button onclick="clearOrders()" class="text-xs text-red-500 hover:underline">Очистить историю</button>
            </div>
            <div id="orders-container" class="space-y-3"></div>
        </section>

        <!-- ВКЛАДКА 4: НОВАЯ ЗАЯВКА -->
        <section id="tab-new-order" class="hidden bg-white rounded-xl shadow-md p-6 max-w-xl mx-auto space-y-4 border-t-4 border-[#10b981]">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-3">📝 Оформление заявки на закупку</h2>
            <form onsubmit="submitMaterialOrder(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Объект:</label>
                    <select id="order-proj" required class="w-full border rounded-lg p-2.5 text-sm bg-white outline-none focus:ring-2 focus:ring-[#10b981]"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Раздел сметы / Этап:</label>
                    <input type="text" id="order-section" required placeholder="например, Электрика" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Наименование материала:</label>
                        <input type="text" id="order-mat" required placeholder="Кабель ВВГнг" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Количество и ед.:</label>
                        <input type="text" id="order-qty" required placeholder="100 м" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Желаемая дата поставки:</label>
                    <input type="date" id="order-date" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <button type="submit" class="w-full bg-[#059669] hover:bg-[#047857] text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">
                    ✅ Отправить заявку в снабжение
                </button>
            </form>
        </section>

    </main>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ОБЪЕКТА -->
    <div id="project-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-gray-800">🏗 Добавить новый объект</h3>
            <form onsubmit="saveNewProject(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Название объекта:</label>
                    <input type="text" id="new-proj-name" required placeholder="Коттедж" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Ответственный прораб:</label>
                    <select id="new-proj-foreman" required class="w-full border rounded-lg p-2.5 text-sm bg-white outline-none focus:ring-2 focus:ring-[#10b981]"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Разделы сметы (через запятую):</label>
                    <input type="text" id="new-proj-sections" required placeholder="Фундамент, Стены, Кровля" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-[#059669] hover:bg-[#047857] text-white font-semibold py-2 rounded-lg text-sm transition">Сохранить</button>
                    <button type="button" onclick="closeAddProjectModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg text-sm transition">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ СОТРУДНИКА -->
    <div id="employee-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-gray-800">👥 Добавить сотрудника</h3>
            <form onsubmit="saveNewEmployee(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ФИО сотрудника:</label>
                    <input type="text" id="emp-name" required placeholder="Иван Прорабов" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Должность:</label>
                    <select id="emp-position" class="w-full border rounded-lg p-2.5 text-sm bg-white outline-none focus:ring-2 focus:ring-[#10b981]">
                        <option value="Директор">Директор</option>
                        <option value="Администратор">Администратор</option>
                        <option value="Главный инженер">Главный инженер</option>
                        <option value="Прораб">Прораб</option>
                        <option value="Снабженец">Снабженец</option>
                        <option value="Инженер ПТО">Инженер ПТО</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Телефон:</label>
                    <input type="tel" id="emp-phone" required placeholder="+38 (050) 000-00-00" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-[#10b981]">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-[#059669] hover:bg-[#047857] text-white font-semibold py-2 rounded-lg text-sm transition">Сохранить</button>
                    <button type="button" onclick="closeAddEmployeeModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg text-sm transition">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КАРТОЧКИ СОТРУДНИКА (ПОДРОБНО) -->
    <div id="employee-card-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800" id="card-modal-title">👤 Карточка сотрудника</h3>
                <button onclick="closeEmployeeCardModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>
            
            <div class="space-y-3 text-sm">
                <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100 space-y-1">
                    <p><strong>ФИО:</strong> <span id="card-emp-name" class="text-gray-900 font-semibold"></span></p>
                    <p><strong>Должность:</strong> <span id="card-emp-position" class="text-gray-900"></span></p>
                    <p><strong>Телефон:</strong> <a id="card-emp-phone-link" href="#" class="text-[#059669] hover:underline font-semibold"></a></p>
                </div>

                <!-- Место под будущую важную информацию -->
                <div class="border rounded-lg p-3 space-y-2 bg-gray-50">
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">📌 Дополнительная информация / Заметки:</p>
                    <textarea id="card-emp-notes" placeholder="Здесь можно указать паспортные данные, объекты, примечания..." class="w-full border rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-[#10b981] h-24 bg-white"></textarea>
                    <button onclick="saveEmployeeNotes()" class="bg-[#059669] hover:bg-[#047857] text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow">Сохранить заметки</button>
                </div>
            </div>

            <div class="flex justify-between pt-2 border-t">
                <button onclick="" id="card-delete-btn" class="text-red-500 hover:text-red-700 text-xs font-semibold">🗑 Удалить сотрудника</button>
                <button onclick="closeEmployeeCardModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded-lg text-xs transition">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('rsk_employees') || !localStorage.getItem('rsk_projects_v3')) {
            const defaultEmployees = [
                { id: 1, name: "Иван Прорабов", position: "Прораб", phone: "+38 (050) 123-45-67", notes: "" },
                { id: 2, name: "Петренко Сергей Николаевич", position: "Прораб", phone: "+380507016548", notes: "" },
                { id: 3, name: "Олег Снабженец", position: "Снабженец", phone: "+38 (067) 987-65-43", notes: "" }
            ];
            localStorage.setItem('rsk_employees', JSON.stringify(defaultEmployees));

            const defaultProjects = [
                { id: 1, name: "Частный дом (Ивановка)", foreman: "Иван Прорабов", sections: ["Фундамент", "Коробка стен", "Кровля", "Инженерные сети"] },
                { id: 2, name: "Реконструкция офиса", foreman: "Петренко Сергей Николаевич", sections: ["Демонтаж", "Перегородки", "Чистовая отделка", "Электрика"] }
            ];
            localStorage.setItem('rsk_projects', JSON.stringify(defaultProjects));
            localStorage.setItem('rsk_projects_v3', 'true');
        }

        if (!localStorage.getItem('rsk_orders')) {
            localStorage.setItem('rsk_orders', JSON.stringify([]));
        }

        document.getElementById('order-date').valueAsDate = new Date();

        function switchTab(tabId) {
            ['projects', 'employees', 'orders', 'new-order'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                const btn = document.getElementById(`btn-${t === 'new-order' ? 'new-order' : t}`);
                if (btn) {
                    btn.classList.remove('bg-[#10b981]');
                    btn.classList.add('bg-[#10b981]/70');
                }
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${tabId === 'new-order' ? 'new-order' : tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-[#10b981]/70');
                activeBtn.classList.add('bg-[#10b981]');
            }

            if (tabId === 'projects') renderProjects();
            if (tabId === 'employees') renderEmployees();
            if (tabId === 'orders') renderOrders();
            if (tabId === 'new-order') updateProjectDropdowns();
        }

        function renderProjects() {
            const projects = JSON.parse(localStorage.getItem('rsk_projects'));
            const employees = JSON.parse(localStorage.getItem('rsk_employees'));
            const container = document.getElementById('projects-container');
            
            if (projects.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm col-span-2 text-center py-6">Нет добавленных объектов</p>`;
                return;
            }

            container.innerHTML = projects.map(p => {
                const foremanObj = employees.find(e => e.name === p.foreman);
                const foremanPhone = foremanObj ? foremanObj.phone : '';

                return `
                    <div class="bg-white rounded-xl shadow-sm border p-4 space-y-3 border-l-4 border-[#10b981]">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-[#047857] text-base">🏗 ${p.name}</h3>
                            <button onclick="deleteProject(${p.id})" class="text-red-400 hover:text-red-600 text-xs">🗑 Удалить</button>
                        </div>
                        <div class="text-xs space-y-1 text-gray-600">
                            <p><strong>👨‍💼 Прораб:</strong> <span class="text-gray-900 font-semibold">${p.foreman || 'Не назначен'}</span></p>
                            ${foremanPhone ? `<p><strong>📞 Телефон:</strong> <a href="tel:${foremanPhone}" class="text-[#059669] hover:underline font-semibold">${foremanPhone}</a></p>` : ''}
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-500 mb-1">Разделы сметы:</p>
                            <div class="flex flex-wrap gap-1">
                                ${p.sections.map(s => `<span class="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded">${s}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderEmployees() {
            const employees = JSON.parse(localStorage.getItem('rsk_employees'));
            const container = document.getElementById('employees-container');
            updateEmployeeBadgeCount();
            
            if (employees.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm col-span-2 text-center py-6">Список сотрудников пуст</p>`;
                return;
            }

            container.innerHTML = employees.map(emp => `
                <button onclick="openEmployeeCard(${emp.id})" class="w-full text-left bg-white rounded-xl shadow-sm border p-4 flex flex-col justify-between space-y-3 border-l-4 border-[#10b981] hover:bg-emerald-50/50 transition cursor-pointer group">
                    <div class="space-y-1 w-full">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-[#047857] text-base group-hover:underline">👤 ${emp.name}</h3>
                            <span class="text-xs text-[#059669] bg-emerald-100 px-2 py-0.5 rounded font-semibold">Открыть карточку →</span>
                        </div>
                        <p class="text-xs text-gray-600"><strong>Должность:</strong> ${emp.position}</p>
                        <p class="text-xs text-gray-600"><strong>Телефон:</strong> <span class="text-[#059669] font-semibold">${emp.phone}</span></p>
                    </div>
                </button>
            `).join('');
        }

        let currentActiveEmpId = null;

        function openEmployeeCard(id) {
            const employees = JSON.parse(localStorage.getItem('rsk_employees'));
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            currentActiveEmpId = id;
            document.getElementById('card-emp-name').innerText = emp.name;
            document.getElementById('card-emp-position').innerText = emp.position;
            const phoneLink = document.getElementById('card-emp-phone-link');
            phoneLink.innerText = emp.phone;
            phoneLink.href = `tel:${emp.phone}`;
            document.getElementById('card-emp-notes').value = emp.notes || '';

            document.getElementById('card-delete-btn').setAttribute('onclick', `deleteEmployee(${emp.id}); closeEmployeeCardModal();`);
            document.getElementById('employee-card-modal').classList.remove('hidden');
        }

        function closeEmployeeCardModal() {
            document.getElementById('employee-card-modal').classList.add('hidden');
            currentActiveEmpId = null;
        }

        function saveEmployeeNotes() {
            if (!currentActiveEmpId) return;
            const notes = document.getElementById('card-emp-notes').value;
            let employees = JSON.parse(localStorage.getItem('rsk_employees'));
            employees = employees.map(e => {
                if (e.id === currentActiveEmpId) e.notes = notes;
                return e;
            });
            localStorage.setItem('rsk_employees', JSON.stringify(employees));
            alert('Заметки успешно сохранены!');
        }

        function openAddProjectModal() {
            updateForemanDropdown();
            document.getElementById('project-modal').classList.remove('hidden');
        }
        function closeAddProjectModal() { document.getElementById('project-modal').classList.add('hidden'); }

        function updateForemanDropdown() {
            const employees = JSON.parse(localStorage.getItem('rsk_employees'));
            const select = document.getElementById('new-proj-foreman');
            if (select) {
                select.innerHTML = employees.map(e => `<option value="${e.name}">${e.name} (${e.position})</option>`).join('');
            }
        }

        function saveNewProject(e) {
            e.preventDefault();
            const name = document.getElementById('new-proj-name').value.trim();
            const foreman = document.getElementById('new-proj-foreman').value;
            const sections = document.getElementById('new-proj-sections').value.split(',').map(s => s.trim()).filter(Boolean);

            let projects = JSON.parse(localStorage.getItem('rsk_projects'));
            projects.push({ id: Date.now(), name, foreman, sections });
            localStorage.setItem('rsk_projects', JSON.stringify(projects));

            document.getElementById('new-proj-name').value = '';
            document.getElementById('new-proj-sections').value = '';
            closeAddProjectModal();
            renderProjects();
        }

        function deleteProject(id) {
            if (confirm('Удалить объект?')) {
                let projects = JSON.parse(localStorage.getItem('rsk_projects')).filter(p => p.id !== id);
                localStorage.setItem('rsk_projects', JSON.stringify(projects));
                renderProjects();
            }
        }

        function openAddEmployeeModal() { document.getElementById('employee-modal').classList.remove('hidden'); }
        function closeAddEmployeeModal() { document.getElementById('employee-modal').classList.add('hidden'); }

        function saveNewEmployee(e) {
            e.preventDefault();
            const name = document.getElementById('emp-name').value.trim();
            const position = document.getElementById('emp-position').value;
            const phone = document.getElementById('emp-phone').value.trim();

            let employees = JSON.parse(localStorage.getItem('rsk_employees'));
            employees.push({ id: Date.now(), name, position, phone, notes: "" });
            localStorage.setItem('rsk_employees', JSON.stringify(employees));

            document.getElementById('emp-name').value = '';
            document.getElementById('emp-phone').value = '';
            closeAddEmployeeModal();
            renderEmployees();
        }

        function deleteEmployee(id) {
            if (confirm('Удалить сотрудника?')) {
                let employees = JSON.parse(localStorage.getItem('rsk_employees')).filter(e => e.id !== id);
                localStorage.setItem('rsk_employees', JSON.stringify(employees));
                renderEmployees();
            }
        }

        function updateProjectDropdowns() {
            const projects = JSON.parse(localStorage.getItem('rsk_projects'));
            const orderSelect = document.getElementById('order-proj');
            if (orderSelect) {
                orderSelect.innerHTML = projects.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
            }
        }

        function submitMaterialOrder(e) {
            e.preventDefault();
            const newOrder = {
                id: Date.now(),
                project: document.getElementById('order-proj').value,
                section: document.getElementById('order-section').value.trim(),
                material: document.getElementById('order-mat').value.trim(),
                quantity: document.getElementById('order-qty').value.trim(),
                date: document.getElementById('order-date').value,
                status: "🔴 Новая",
                createdAt: new Date().toLocaleString()
            };

            let orders = JSON.parse(localStorage.getItem('rsk_orders'));
            orders.unshift(newOrder);
            localStorage.setItem('rsk_orders', JSON.stringify(orders));

            document.getElementById('order-mat').value = '';
            document.getElementById('order-qty').value = '';
            updateOrdersBadgeCount();
            switchTab('orders');
        }

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('rsk_orders'));
            const container = document.getElementById('orders-container');
            updateOrdersBadgeCount();

            if (orders.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6 text-sm">Активных заявок нет</p>`;
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="border rounded-xl p-3.5 bg-gray-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 text-sm">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-[#047857]">🏗 ${o.project}</span>
                            <span class="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-700">${o.section}</span>
                        </div>
                        <p>📦 <b>${o.material}</b> — <span class="text-[#059669] font-semibold">${o.quantity}</span></p>
                        <p class="text-xs text-gray-500">⏳ Срок: <b>${o.date}</b></p>
                        <div>
                            <span class="inline-block mt-1 px-2 py-0.5 text-xs font-bold rounded ${
                                o.status === '🔴 Новая' ? 'bg-red-100 text-red-700' :
                                o.status === '🟡 В работе' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'
                            }">${o.status}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                        <select onchange="updateOrderStatus(${o.id}, this.value)" class="border text-xs rounded p-1.5 bg-white outline-none">
                            <option value="🔴 Новая" ${o.status === '🔴 Новая' ? 'selected' : ''}>🔴 Новая</option>
                            <option value="🟡 В работе" ${o.status === '🟡 В работе' ? 'selected' : ''}>🟡 В работе</option>
                            <option value="🟢 Закуплено" ${o.status === '🟢 Закуплено' ? 'selected' : ''}>🟢 Закуплено</option>
                        </select>
                        <button onclick="deleteOrder(${o.id})" class="text-red-500 text-xs px-2 py-1 border rounded bg-white">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function updateOrderStatus(id, status) {
            let orders = JSON.parse(localStorage.getItem('rsk_orders')).map(o => {
                if (o.id === id) o.status = status;
                return o;
            });
            localStorage.setItem('rsk_orders', JSON.stringify(orders));
            renderOrders();
        }

        function deleteOrder(id) {
            let orders = JSON.parse(localStorage.getItem('rsk_orders')).filter(o => o.id !== id);
            localStorage.setItem('rsk_orders`, JSON.stringify(orders));
            renderOrders();
        }

        function clearOrders() {
            if (confirm('Очистить историю?')) {
                localStorage.setItem('rsk_orders', JSON.stringify([]));
                renderOrders();
            }
        }

        function updateOrdersBadgeCount() {
            const orders = JSON.parse(localStorage.getItem('rsk_orders'));
            const tag = document.getElementById('orders-badge');
            if (tag) tag.innerText = orders.length;
        }

        function updateEmployeeBadgeCardCount() {} // заглушка

        function updateEmployeeBadgeCount() {
            const employees = JSON.parse(localStorage.getItem('rsk_employees'));
            const badge = document.getElementById('employees-badge');
            if (badge) badge.innerText = employees.length;
        }

        updateOrdersBadgeCount();
        updateEmployeeBadgeCount();
        renderProjects();
    </script>
</body>
</html>
