<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет строительных материалов и затрат</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Шапка приложения -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-4 rounded-2xl shadow-sm border gap-4">
            <div>
                <h1 class="text-xl font-bold text-gray-900">Реестр закрытых материалов</h1>
                <p class="text-xs text-gray-500">Управление закупками, объектами и расчетами</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2.5 rounded-xl transition shadow-sm w-full sm:w-auto">
                    + Добавить материал
                </button>
            </div>
        </header>

        <!-- Основной блок с таблицей и фильтрами -->
        <main class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border space-y-4">
            
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Список записей</h2>
                <span id="record-count" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-lg font-medium">Всего: 0</span>
            </div>

            <!-- ТАБЛИЦА С ФИЛЬТРАМИ -->
            <div class="overflow-x-auto border rounded-xl">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-100 text-gray-700 uppercase border-b font-semibold">
                        <tr>
                            <th class="p-2.5">Дата</th>
                            <th class="p-2.5">Наименование</th>
                            <th class="p-2.5">Ед. изм.</th>
                            <th class="p-2.5">Кол-во</th>
                            <th class="p-2.5">Цена за ед.</th>
                            <th class="p-2.5">Сумма</th>
                            <th class="p-2.5">Статус оплаты</th>
                            <th class="p-2.5">Поставщик</th>
                            <th class="p-2.5">Объект</th>
                            <th class="p-2.5">Раздел</th>
                        </tr>
                        <tr class="bg-gray-50 border-t">
                            <th class="p-1.5">
                                <select id="flt-date" onchange="renderMaterialsRegistry()" class="w-full border rounded p-1 text-[11px] font-normal bg-white outline-none">
                                    <option value="">Все</option>
                                </select>
                            </th>
                            <th class="p-1.5"></th>
                            <th class="p-1.5"></th>
                            <th class="p-1.5"></th>
                            <th class="p-1.5"></th>
                            <th class="p-1.5"></th>
                            <th class="p-1.5">
                                <select id="flt-payment" onchange="renderMaterialsRegistry()" class="w-full border rounded p-1 text-[11px] font-normal bg-white outline-none">
                                    <option value="">Все</option>
                                    <option value="Оплачено">Оплачено</option>
                                    <option value="В долг">В долг</option>
                                </select>
                            </th>
                            <th class="p-1.5">
                                <select id="flt-supplier" onchange="renderMaterialsRegistry()" class="w-full border rounded p-1 text-[11px] font-normal bg-white outline-none">
                                    <option value="">Все</option>
                                </select>
                            </th>
                            <th class="p-1.5">
                                <select id="flt-proj" onchange="renderMaterialsRegistry()" class="w-full border rounded p-1 text-[11px] font-normal bg-white outline-none">
                                    <option value="">Все</option>
                                </select>
                            </th>
                            <th class="p-1.5">
                                <select id="flt-sec" onchange="renderMaterialsRegistry()" class="w-full border rounded p-1 text-[11px] font-normal bg-white outline-none">
                                    <option value="">Все</option>
                                </select>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="registry-materials-tbody" class="divide-y">
                        <!-- Данные генерируются динамически -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Модальное окно (Пример структуры) -->
    <div id="materialModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-gray-900" id="modalTitle">Карточка материала</h3>
            <div id="modalContent" class="space-y-3 text-sm">
                <!-- Контент модального окна -->
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xs font-medium transition">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- СКРИПТЫ ПРИЛОЖЕНИЯ -->
    <script>
        // Демо-данные (массив объектов)
        let materialsData = [
            {
                date: "12.08.2026",
                name: "Цемент М-500",
                unit: "мюк",
                qty: 50,
                unitPrice: 200,
                sum: 10000,
                paymentStatus: "Оплачено",
                supplier: "СтройСнаб",
                project: "ЖК Оболонь",
                section: "Фундамент"
            },
            {
                date: "10.08.2026",
                name: "Арматура Ø12",
                unit: "тн",
                qty: 2.5,
                unitPrice: 31000,
                sum: 77500,
                paymentStatus: "В долг",
                supplier: "МеталлТрейд",
                project: "Коттедж Вита",
                section: "Каркас"
            }
        ];

        // Инициализация при загрузке страницы
        document.addEventListener("DOMContentLoaded", () => {
            updateFiltersLists();
            renderMaterialsRegistry();
        });

        // Функция обновления селектов фильтров на основе имеющихся данных
        function updateFiltersLists() {
            const dates = [...new Set(materialsData.map(item => item.date))];
            const suppliers = [...new Set(materialsData.map(item => item.supplier))];
            const projects = [...new Set(materialsData.map(item => item.project))];
            const sections = [...new Set(materialsData.map(item => item.section))];

            populateSelect('flt-date', dates);
            populateSelect('flt-supplier', suppliers);
            populateSelect('flt-proj', projects);
            populateSelect('flt-sec', sections);
        }

        function populateSelect(elementId, items) {
            const select = document.getElementById(elementId);
            const currentVal = select.value;
            let html = '<option value="">Все</option>';
            items.forEach(i => {
                html += `<option value="${i}">${i}</option>`;
            });
            select.innerHTML = html;
            select.value = currentVal;
        }

        // Рендеринг таблицы с учетом выбранных фильтров
        function renderMaterialsRegistry() {
            const fDate = document.getElementById('flt-date').value;
            const fPayment = document.getElementById('flt-payment').value;
            const fSupplier = document.getElementById('flt-supplier').value;
            const fProj = document.getElementById('flt-proj').value;
            const fSec = document.getElementById('flt-sec').value;

            const filtered = materialsData.filter(item => {
                return (!fDate || item.date === fDate) &&
                       (!fPayment || item.paymentStatus === fPayment) &&
                       (!fSupplier || item.supplier === fSupplier) &&
                       (!fProj || item.project === fProj) &&
                       (!fSec || item.section === fSec);
            });

            document.getElementById('record-count').innerText = `Всего: ${filtered.length}`;

            const tbody = document.getElementById('registry-materials-tbody');

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-gray-400 py-6">Нет данных в реестре материалов</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((item) => {
                const paymentBadge = item.paymentStatus === 'В долг' 
                    ? `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold text-[10px]">В долг</span>` 
                    : `<span class="bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold text-[10px]">Оплачено</span>`;

                const jsonStr = encodeURIComponent(JSON.stringify(item));

                return `
                    <tr onclick="openMaterialCard('${jsonStr}')" class="hover:bg-emerald-50/60 cursor-pointer transition">
                        <td class="p-2.5 whitespace-nowrap">${item.date}</td>
                        <td class="p-2.5 font-semibold text-gray-900">${item.name}</td>
                        <td class="p-2.5 whitespace-nowrap">${item.unit}</td>
                        <td class="p-2.5 whitespace-nowrap">${item.qty}</td>
                        <td class="p-2.5 whitespace-nowrap">${item.unitPrice.toLocaleString('ru-RU')} грн</td>
                        <td class="p-2.5 whitespace-nowrap font-bold text-[#15803d]">${item.sum.toLocaleString('ru-RU')} грн</td>
                        <td class="p-2.5 whitespace-nowrap">${paymentBadge}</td>
                        <td class="p-2.5 whitespace-nowrap text-gray-800">${item.supplier}</td>
                        <td class="p-2.5 whitespace-nowrap font-medium text-gray-800">${item.project}</td>
                        <td class="p-2.5 whitespace-nowrap text-gray-600">${item.section}</td>
                    </tr>
                `;
            }).join('');
        }

        // Управление модальным окном
        function openMaterialCard(encodedJson) {
            const item = JSON.parse(decodeURIComponent(encodedJson));
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <p><strong>Наименование:</strong> ${item.name}</p>
                <p><strong>Дата:</strong> ${item.date}</p>
                <p><strong>Объект:</strong> ${item.project} (${item.section})</p>
                <p><strong>Поставщик:</strong> ${item.supplier}</p>
                <p><strong>Количество:</strong> ${item.qty} ${item.unit}</p>
                <p><strong>Сумма:</strong> ${item.sum.toLocaleString('ru-RU')} грн</p>
                <p><strong>Статус:</strong> ${item.paymentStatus}</p>
            `;
            
            document.getElementById('materialModal').classList.remove('hidden');
            document.getElementById('materialModal').classList.add('flex');
        }

        function openAddModal() {
            alert('Здесь будет форма добавления нового материала.');
        }

        function closeModal() {
            document.getElementById('materialModal').classList.remove('flex');
            document.getElementById('materialModal').classList.add('hidden');
        }
    </script>
</body>
</html>
